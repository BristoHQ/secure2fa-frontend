<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processing Authentication - SecureTOTP</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #1a1a1a 0%, #0d1117 100%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: white;
      }
      .processing-container {
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        backdrop-filter: blur(10px);
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(19, 172, 88, 0.3);
        border-top: 4px solid #13ac58;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      h1 {
        color: #13ac58;
        margin-bottom: 10px;
      }
      p {
        color: #c6c6c6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="processing-container">
      <div class="spinner"></div>
      <h1>Processing Authentication</h1>
      <p>Please wait while we complete your login...</p>
    </div>

    <script>
      // Extract token from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (token) {
        // Redirect to React app with token
        const reactAppUrl = `${window.location.protocol}//${
          window.location.hostname
        }:3000/auth/token-handler?token=${encodeURIComponent(token)}`;
        window.location.href = reactAppUrl;
      } else {
        // No token found, redirect to login
        const loginUrl = `${window.location.protocol}//${window.location.hostname}:3000/login`;
        setTimeout(() => {
          window.location.href = loginUrl;
        }, 3000);
      }
    </script>
  </body>
</html>
